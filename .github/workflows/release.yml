name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK and CMake
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          echo "y" | sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version from tag
        id: get_version
        run: |
          RAW_VERSION="${GITHUB_REF#refs/tags/}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          echo "VERSION=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Build AAR and Publish to Maven Central
        run: |
          ./gradlew :mediainfo-lib:publishAndReleaseToMavenCentral \
            -PVERSION_NAME=${{ steps.get_version.outputs.CLEAN_VERSION }} \
            --no-daemon \
            --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}

      - name: Rename AAR for GitHub Release
        run: |
          cp mediainfo-lib/build/outputs/aar/mediainfo-lib-release.aar mediainfo-android-${{ steps.get_version.outputs.VERSION }}.aar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mediainfo-android-${{ steps.get_version.outputs.VERSION }}.aar
          body: |
            ## MediaInfo Android Library ${{ steps.get_version.outputs.VERSION }}

            ### Maven Central

            ```groovy
            dependencies {
                implementation 'io.github.marlboro-advance:mediainfo-android:${{ steps.get_version.outputs.CLEAN_VERSION }}'
            }
            ```

            Or via Kotlin DSL:
            ```kotlin
            dependencies {
                implementation("io.github.marlboro-advance:mediainfo-android:${{ steps.get_version.outputs.CLEAN_VERSION }}")
            }
            ```

            ### Standalone AAR Installation
            Download the attached `mediainfo-android-${{ steps.get_version.outputs.VERSION }}.aar` and place it in your `app/libs` directory:
            ```groovy
            dependencies {
                implementation files('libs/mediainfo-android-${{ steps.get_version.outputs.VERSION }}.aar')
            }
            ```
          draft: false
          prerelease: false
