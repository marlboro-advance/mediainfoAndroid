plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'com.vanniktech.maven.publish'
}

android {
    compileSdk 36
    namespace "net.mediaarea.mediainfo.lib"

    defaultConfig {
        minSdk 21

        consumerProguardFiles 'consumer-rules.pro'

        externalNativeBuild {
            cmake {
                cppFlags "-DUNICODE -D_UNICODE -DMEDIAINFO_ADVANCED_NO -DMEDIAINFO_REFERENCES_NO -DMEDIAINFO_FILTER_NO -DMEDIAINFO_DUPLICATE_NO -DMEDIAINFO_MACROBLOCKS_NO -DMEDIAINFO_TRACE_NO -DMEDIAINFO_TRACE_FFV1CONTENT_NO -DMEDIAINFO_IBI_NO -DMEDIAINFO_DIRECTORY_NO -DMEDIAINFO_LIBCURL_NO -DMEDIAINFO_LIBMMS_NO -DMEDIAINFO_DVDIF_ANALYZE_NO -DMEDIAINFO_MPEGTS_DUPLICATE_NO -DMEDIAINFO_READTHREAD_NO -DMEDIAINFO_MD5_NO -DMEDIAINFO_SHA1_NO -DMEDIAINFO_SHA2_NO -DMEDIAINFO_EVENTS_NO -DMEDIAINFO_DEMUX_NO -DMEDIAINFO_AES_NO -DMEDIAINFO_FIXITY_NO -DMEDIAINFO_READER_NO -DMEDIAINFO_NEXTPACKET_NO"
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    // No dependencies needed - just Kotlin stdlib (automatically included)
}

mavenPublishing {
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL, true)
    def hasSigningKey = project.hasProperty("signingInMemoryKey") ||
                        project.hasProperty("signing.keyId") ||
                        System.getenv("ORG_GRADLE_PROJECT_signingInMemoryKey") != null ||
                        System.getenv("SIGNING_KEY") != null
    if (hasSigningKey) {
        signAllPublications()
    }

    pom {
        name = "mediainfoAndroid"
        description = "An Android library wrapper for MediaInfoLib, providing comprehensive media analysis capabilities."
        inceptionYear = "2024"
        url = "https://github.com/marlboro-advance/mediainfoAndroid"
        licenses {
            license {
                name = "BSD-2-Clause"
                url = "https://opensource.org/licenses/BSD-2-Clause"
                distribution = "repo"
            }
        }
        developers {
            developer {
                id = "marlboro-advance"
                name = "MarlboroAdvance"
                url = "https://github.com/marlboro-advance"
            }
        }
        scm {
            url = "https://github.com/marlboro-advance/mediainfoAndroid"
            connection = "scm:git:git://github.com/marlboro-advance/mediainfoAndroid.git"
            developerConnection = "scm:git:ssh://git@github.com/marlboro-advance/mediainfoAndroid.git"
        }
    }
}

